name: homework3-investigator
services:
  buggy-react:
    build: .
    container_name: homework3-react
    ports:
      - "127.0.0.1:4173:3000"
    environment:
      DEMO_PROFILE: ${DEMO_PROFILE:-normal}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 10
  browser-tests:
    profiles: ["tests"]
    build: ./tests/browser
    environment:
      APP_URL: http://buggy-react:3000
    depends_on:
      buggy-react:
        condition: service_healthy
